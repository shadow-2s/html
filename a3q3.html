<!DOCTYPE html>
<html>
<style> 
        a:link {
                 color:#FF0000;
               }
        a:visited {
                 color:#FFFF00;
               }
        a:hover{
                 color:#FF00FF;
               }
        a:active  {
                 color:#0000FF;
               }
</style>
<body>
<h2>hyperlink color demonstration </h2>
<a href ="https://google.com">link 1</a>
<a href ="https://crazy.com">link 2</a>
</body>
</html>
