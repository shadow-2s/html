<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login page</title>
</head>
<body>
    <h3>Registration form</h3>
    <form>
        <fieldset align="center">
            <legend>LOGIN</legend>
        <lable for="Username">Username: </lable>
        <input type="text" id="Username" name="Username"><br>
        <lable for="Passward">Passward: </lable>
        <input type="Passward" id="Passward" name="Passward"><br>
        <lable for="Conform Passward">Conform Passward: </lable>
        <input type="Passward" id="Conform Passward" name="Conform Passward"><br>
        <lable for="Text">Gender:</lable>
        <input type="radio" id="Male" name="Gender" value="Male">
        <lable for="Male">Male</lable>
        <input type="radio" id="Female" name="Gender" value="Female">
        <lable for="Female">Female</lable><br>
        <lable for="Text">Address:</lable>
        <input type="text" id="Address" name="Address"><br>
        <label for="">Choose a country:</label>

        <select id="" name="country">
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">United Kingdom</option>
            <option value="canada">Canada</option>
        </select>
        
        </fieldset>
    </form>
</body>
